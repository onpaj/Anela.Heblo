name: 🔄 CI - Feature Branch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel previous runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: read
  checks: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: heblo

jobs:
  # Opt-out gate: put [skip-tests] in the PR head commit message to skip the
  # frontend/backend tests and go straight to the Docker build (then deploy via
  # deploy-staging-manual.yml). Commit message is used instead of a label because
  # labeling would retrigger the workflow and cancel the in-flight run.
  gate:
    name: 🚦 Test Gate
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.check.outputs.skip_tests }}
    steps:
      - name: 🔍 Check head commit for [skip-tests]
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An API hiccup must not block the tests: fall back to an empty message (= run tests).
          MSG=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}" -q .commit.message || true)
          if printf '%s' "$MSG" | grep -qF '[skip-tests]'; then
            echo "skip_tests=true" >> "$GITHUB_OUTPUT"
            echo "## ⚠️ Tests skipped via [skip-tests] in head commit" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip_tests=false" >> "$GITHUB_OUTPUT"
          fi

  # Process docs - schema, index, orphans (warn during backfill) + stale-doc PR comment.
  # Fast gate: the test jobs below need it, so a doc failure fails the PR in ~1 min.
  process-docs:
    name: 📚 Process Docs
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install pyyaml pytest

      - name: 🧪 Test the checker
        run: python -m pytest scripts/process-docs -q

      - name: 🔍 Check process docs
        run: python scripts/process-docs/check.py check

      - name: 💬 Flag process docs this PR may have made stale
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          MARKER='<!-- process-docs -->'

          python scripts/process-docs/check.py pr --base "origin/${{ github.base_ref }}" \
            --comment-file process-docs-comment.md --resolved-file process-docs-resolved.md

          BODY_FILE=""
          CREATE_IF_MISSING=0
          if [ -f process-docs-comment.md ]; then
            BODY_FILE=process-docs-comment.md
            CREATE_IF_MISSING=1
          elif [ -f process-docs-resolved.md ]; then
            # Nothing flagged: only ever update an existing marker comment to "resolved" —
            # never create a fresh comment just to say nothing is wrong.
            BODY_FILE=process-docs-resolved.md
          fi

          # Nothing to say and nothing to resolve — leave any prior comment as-is.
          if [ -z "$BODY_FILE" ]; then
            exit 0
          fi

          # Find our own prior comment (if any) by its hidden marker, among all comments
          # on this PR — never touch a comment from another bot/step (e.g. staging-deploy).
          EXISTING_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"${MARKER}\"))] | last | .id" 2>/dev/null)

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING_ID}" -F body=@"${BODY_FILE}"
            STATUS=$?
          elif [ "$CREATE_IF_MISSING" = "1" ]; then
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@"${BODY_FILE}"
            STATUS=$?
          else
            STATUS=0
          fi

          if [ $STATUS -ne 0 ]; then
            echo "::warning::Could not upsert the process-docs PR comment (read-only token on fork PRs?) — see the check output above"
          fi

          if [ "$CREATE_IF_MISSING" = "1" ]; then
            echo "::error::This PR changes code owned by process docs without touching them — update the doc, or bump its verified_at if behaviour didn't change"
            exit 1
          fi
          exit 0

  # Frontend Tests - Parallel execution
  frontend-tests:
    name: 🎯 Frontend Tests
    runs-on: ubuntu-latest
    needs: [process-docs, gate]
    if: needs.gate.outputs.skip_tests != 'true'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      # No coverage on PRs (Jest/istanbul instrumentation of every file); it runs nightly instead —
      # see e2e-nightly-regression.yml: frontend-coverage.
      - name: 🧪 Run tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false --reporters=default --reporters=jest-junit
        env:
          REACT_APP_USE_MOCK_AUTH: true
          CI: true
          JEST_JUNIT_OUTPUT_DIR: ./test-results
          JEST_JUNIT_OUTPUT_NAME: junit.xml

      - name: 🔍 Dead export detection (knip, non-blocking)
        working-directory: ./frontend
        continue-on-error: true
        run: npm run knip | tee knip-report.txt

      - name: 📦 Persist knip report
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: knip-report
          path: frontend/knip-report.txt
          retention-days: 14

      - name: 📋 Frontend Test Report
        if: success() || failure()
        continue-on-error: true
        run: echo "Test report upload skipped (test-reporter unavailable from codeload)"

  # Backend Tests - Parallel execution
  backend-tests:
    name: 🎯 Backend Tests
    runs-on: ubuntu-latest
    needs: [process-docs, gate]
    if: needs.gate.outputs.skip_tests != 'true'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Verify .NET SDK
        run: dotnet --version

      - name: 📦 Restore dependencies
        run: dotnet restore Anela.Heblo.sln

      - name: Guard against managed transactions
        run: ./scripts/check-no-managed-tx.sh

      - name: 🏗️ Build solution (Release, once)
        run: dotnet build Anela.Heblo.sln --configuration Release --no-restore

      # No coverage here on purpose: the XPlat coverage collector instruments every referenced
      # assembly per test project (~100 s each, serially) and turned a ~2 min test run into
      # ~12 min. Coverage runs nightly instead (see e2e-nightly-regression.yml: backend-coverage).
      - name: 🧪 Run tests (excluding Playwright and Integration tests)
        run: dotnet test Anela.Heblo.sln --configuration Release --no-build --logger trx --logger "console;verbosity=normal" --results-directory ./test-results --filter "Category!=Playwright&Category!=Integration"
        env:
          ASPNETCORE_ENVIRONMENT: Automation
          # Shoptet integration test configuration
          ProductPriceOptions__ProductExportUrl: ${{ secrets.SHOPTET_PRODUCT_EXPORT_URL }}
          # FlexiBee integration test configuration
          FlexiBeeSettings__Server: ${{ secrets.FLEXIBEE_SERVER_URL }}
          FlexiBeeSettings__Login: ${{ secrets.FLEXIBEE_USERNAME }}
          FlexiBeeSettings__Password: ${{ secrets.FLEXIBEE_PASSWORD }}
          FlexiBeeSettings__Company: ${{ secrets.FLEXIBEE_COMPANY }}

      - name: 📋 Backend Test Report
        if: success() || failure()
        continue-on-error: true
        run: echo "Test report upload skipped (test-reporter unavailable from codeload)"

  # Builds the image in parallel with the test jobs and warms the shared GHA layer cache
  # (nothing is pushed). build-and-push below waits for the tests AND this job, then re-runs the
  # same build against the warm cache — so an image is still only pushed once tests are green,
  # but the ~9 min image build no longer sits behind them.
  docker-build:
    name: 🐳 Build Docker Image (cache warm-up)
    runs-on: ubuntu-latest
    needs: [process-docs, gate]
    if: ${{ !cancelled() && !failure() && github.actor != 'dependabot[bot]' }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_USE_MOCK_AUTH=false
            REACT_APP_AZURE_CLIENT_ID=${{ secrets.REACT_APP_AZURE_CLIENT_ID }}
            REACT_APP_AZURE_AUTHORITY=${{ secrets.REACT_APP_AZURE_AUTHORITY }}
            REACT_APP_AZURE_BACKEND_CLIENT_ID=${{ secrets.REACT_APP_AZURE_BACKEND_CLIENT_ID }}
            REACT_APP_AZURE_TENANT_ID=${{ secrets.REACT_APP_AZURE_TENANT_ID }}


  # Build and Push Docker Image (no manual approval needed)
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [process-docs, gate, frontend-tests, backend-tests, docker-build]
    # Tests passed OR were skipped via [skip-tests]; never after a failure (incl. process-docs).
    if: ${{ !cancelled() && !failure() && github.actor != 'dependabot[bot]' }}
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Generate version tag
        id: version
        run: |
          # Tag with the PR's branch HEAD SHA (not the merge commit SHA)
          # so deploy-staging-manual.yml — which resolves via `gh pr view --json headRefOid` —
          # asks for the same tag this job pushes.
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          VERSION="staging-PR${{ github.event.pull_request.number }}-${HEAD_SHA:0:7}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Version: $VERSION"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📝 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=staging-latest

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_USE_MOCK_AUTH=false
            REACT_APP_AZURE_CLIENT_ID=${{ secrets.REACT_APP_AZURE_CLIENT_ID }}
            REACT_APP_AZURE_AUTHORITY=${{ secrets.REACT_APP_AZURE_AUTHORITY }}
            REACT_APP_AZURE_BACKEND_CLIENT_ID=${{ secrets.REACT_APP_AZURE_BACKEND_CLIENT_ID }}
            REACT_APP_AZURE_TENANT_ID=${{ secrets.REACT_APP_AZURE_TENANT_ID }}
